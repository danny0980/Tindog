# Chronos Chess behind Caddy (automatic HTTPS from Let's Encrypt).
#
#   1. Point your domain's DNS at this server.
#   2. cp server/.env.example server/.env and fill it in (PUBLIC_URL=https://your-domain, SMTP_URL and/or GOOGLE_CLIENT_ID).
#   3. DOMAIN=chess.example.com docker compose -f deploy/docker-compose.yml up -d --build
#
# Both containers restart on their own (after a crash, and when the machine reboots).
# The game server also exits on purpose when its database stops answering, so it is restarted.
services:
  chess:
    build: ..
    restart: unless-stopped
    env_file: ../server/.env
    environment:
      NODE_ENV: production
      DATABASE_FILE: /data/chess.db
      TRUST_PROXY: '1'
    volumes:
      - chess-data:/data
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:'+(process.env.PORT||8787)+'/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # Room to shut down cleanly: open games are saved and come back after the restart.
    stop_grace_period: 15s
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      chess:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN, e.g. DOMAIN=chess.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  chess-data:
  caddy-data:
  caddy-config:
