<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Play chess against Stockfish or a friend — fast, responsive and mobile ready." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Orbitron:wght@600;800&display=swap"
      rel="stylesheet"
    />
    <title>Chess Arena</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Boot guard: if the app never starts (opened as a file, served without
      building, or blocked by an old browser), explain how to open it instead
      of leaving a blank page.
    -->
    <script>
      (function () {
        function help(reason) {
          var root = document.getElementById('root')
          if (!root || root.childElementCount > 0) return
          root.innerHTML =
            '<div dir="rtl" style="max-width:34rem;margin:12vh auto;padding:1.5rem;font:16px/1.6 system-ui,sans-serif;color:#e2e8f0;background:#151922;border:1px solid #2a3140;border-radius:1rem">' +
            '<h1 style="margin:0 0 .5rem;font-size:1.3rem">♞ האפליקציה לא נטענה</h1>' +
            '<p style="margin:0 0 .75rem">' + reason + '</p>' +
            '<p style="margin:0 0 .25rem">כדי להיכנס, הריצו בתיקייה <b>chess</b>:</p>' +
            '<pre dir="ltr" style="background:#0b0d12;padding:.75rem;border-radius:.5rem;overflow:auto">npm install\nnpm run dev</pre>' +
            '<p style="margin:.5rem 0 0">ואז פתחו את הכתובת שמופיעה בטרמינל (בדרך כלל <span dir="ltr">http://localhost:5173</span>).</p>' +
            '<p dir="ltr" style="margin:1rem 0 0;font-size:.85rem;color:#94a3b8;text-align:left">The app didn\'t start. Run <code>npm install</code> and <code>npm run dev</code> in the chess folder, then open the printed localhost URL.</p>' +
            '</div>'
        }
        if (location.protocol === 'file:') {
          help('פתחתם את הקובץ ישירות מהמחשב (file://). דפדפנים חוסמים אפליקציה כזאת כשהיא לא מוגשת משרת.')
          return
        }
        window.addEventListener('load', function () {
          setTimeout(function () {
            help('הדף נפתח, אבל הקוד של האפליקציה לא רץ (למשל קבצי המקור הוגשו בלי build, או שגיאה בדפדפן).')
          }, 8000)
        })
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
